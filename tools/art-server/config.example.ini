# Copy to config.ini (same folder) and fill in. Keep config.ini private: chmod 600 config.ini
# config.ini is git-ignored.

[screenscraper]
# Your ScreenScraper account (https://www.screenscraper.fr, free).
user =
password =
# ScreenScraper's API also wants developer credentials. Ask for them on the ScreenScraper forum
# (free for free, non-commercial software). Try leaving these empty first: --test tells you if they are needed.
devid =
devpassword =
softname = slot-android-art-server
# What to look for, in order: support-texture = scan of the cart label / disc print, support-2D = drawn disc/cart.
# Add box-2D at the end if you also want box art for games that have neither.
media = support-texture, support-2D
# Preferred regions, in order (us, wor = world, eu, ss = ScreenScraper default, jp, fr, de, ...).
regions = us, wor, eu, ss, jp
seconds_between_requests = 1.2

[server]
host = 0.0.0.0
port = 8787
cache = cache
overrides = overrides
retry_missing_after_days = 30
